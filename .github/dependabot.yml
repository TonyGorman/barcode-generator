version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:01"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Stay on TypeScript 5.x until typescript-eslint supports 6+/7+
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

    groups:
      all-npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
    groups:
      all-github-actions-dependencies:
        patterns:
          - "*"
